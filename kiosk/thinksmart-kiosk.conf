# ThinkSmart kiosk settings. Change with: sudo kiosk-mode url <URL> / sudo kiosk-mode rotation <value>
# Page shown full screen; while it can't be loaded the built-in welcome page is shown
URL="http://127.0.0.1:8090/"
# Panel is natively 800x1280 portrait. Rotation: normal, 90, 180, 270
ROTATION=90
OUTPUT=DSI-1
# Web page GPU acceleration: never | on-demand | always. on-demand needs the patched Mesa
# (mesa/ in this repository); without it add FD_MESA_DEBUG=sysmem to WEBKIT_ENV
GPU="on-demand"
# Extra environment for the browser's WebKit and Mesa. noscis: freedreno's scissor-limited
# tiling leaves stale tiles on this Adreno 506 (blocky patches, half-cut glows); full-frame bins are clean.
# SKIA_GPU_PAINTING_THREADS=0: with Skia painting on worker threads the compositor and workers spin
# inside freedreno together and the page freezes (seen with the v2 client UI)
WEBKIT_ENV="FD_MESA_DEBUG=sysmem WEBKIT_FORCE_VBLANK_TIMER=1 WEBKIT_SKIA_ENABLE_CPU_RENDERING=1"
# Where the welcome page's QR code points (install guide)
#HELP_URL="https://github.com/justhalfbit/xiaozhi-hub-server"
#WEBKIT_FEATURES="-UnifyDamagedRegions"   # switch WebKit feature flags (names: WebKit2.Settings.get_all_features())
