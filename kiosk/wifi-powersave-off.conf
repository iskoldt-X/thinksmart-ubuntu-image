[connection]
# The QCA9379 (ath10k_sdio) misses DHCP replies in Wi-Fi power save: IPv4 came 1-3 minutes
# late on about 2 boots in 5 (no internet meanwhile); with power save off 6 boots in 6 got it
# within a second. Read after Ubuntu's default-wifi-powersave-on.conf (name order).
wifi.powersave = 2
