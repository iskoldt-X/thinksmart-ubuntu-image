# Keep the graph at 48 kHz: a rate switch re-prepares the speaker PCM and the DSP
# answers "Buffer already allocated" (q6asm open_write fails).
# Quantum at least 1024 (21 ms): smaller ones make the Python voice client underrun.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 1024
}
