# Default ALSA device for apps such as py-xiaozhi: everything goes through PipeWire
# (pipewire ALSA plugin; PortAudio busy-spins two cores on the pulse plugin). The mic
# reaches PipeWire through thinksmart-mic (arecord -> pipe source), never through
# PipeWire's own ALSA source. Pinned to 48 kHz stereo S16 so the DSP never sees a
# rate change.
pcm.!default {
    type plug
    slave { pcm "pipewire" rate 48000 channels 2 format S16_LE }
}
ctl.!default { type pipewire }
