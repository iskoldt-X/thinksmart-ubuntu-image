# With zram (thinksmart-zram.service) swapping is cheap: swap anonymous memory out readily rather
# than dropping file cache, and one page at a time (no read-ahead on a RAM disk). Replaces the
# image's 99-swappiness.conf (vm.swappiness=10, set when there was no swap at all).
vm.swappiness=100
vm.page-cluster=0
